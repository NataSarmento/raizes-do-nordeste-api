server:
  port: ${PORT:8080}
spring:
  application:
    name: raizes-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/raizes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # o esquema é criado SOMENTE pelas migrations Flyway
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
app:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-com-no-minimo-32-caracteres}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
